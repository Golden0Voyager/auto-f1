name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin explicitly: `@v5` alone floats to whatever uv is current, so
          # the `uv export` contract the audit gate depends on can drift.
          version: "0.13.4"

      - name: Set up Python
        run: uv python install 3.12

      # `--locked` makes the committed uv.lock authoritative. Plain `uv sync`
      # silently re-locks when pyproject.toml and uv.lock drift, so CI could
      # install versions nobody committed while the audit gate's `uv export
      # --frozen` then read that rewritten lock instead of the repo's.
      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run ruff check
        run: uv run ruff check auto_f1/ tests/

      - name: Run mypy
        run: uv run mypy auto_f1/ || true

      # bandit only honors `[tool.bandit]` when told to read pyproject.toml, and
      # parsing TOML requires the `toml` extra. Without both, the skip list was
      # silently inert. This is a security gate, so no `|| true`: a finding
      # must fail the build.
      - name: Run security scan (bandit)
        run: uv tool run --from 'bandit[toml]==1.9.4' bandit -c pyproject.toml -r auto_f1/

      # `uv audit` is not a subcommand of uv: this step errored on every run and
      # `|| true` turned that into a green tick, so nothing was ever audited.
      #
      # PYSEC-2026-3625 (msgpack, DoS via Unpacker reuse) is ignored on purpose:
      # signalrcore 1.0.2 pins `msgpack==1.1.2` exactly, so 1.2.1 cannot resolve
      # without overriding an upstream pin. Availability-only impact. Revisit
      # when signalrcore relaxes the pin.
      - name: Audit dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" \
            --progress-spinner off --ignore-vuln PYSEC-2026-3625


      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing tests/

      - name: Enforce coverage threshold
        run: uv run coverage report
